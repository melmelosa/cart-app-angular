<navbar
  [itemsCarroNav]="totalItems"
  (openCloseCartEmmiter)="openCloseCart()"
></navbar>

<div class="container">
  <div class="row">
    <catalogo
      [productsCatalogo]="productos"
      (productAdded)="addCart($event)"
    ></catalogo>

    @if(showCart){
   
    <cart-modal [itemsCartModal]="itemsCarro"
    [totalModal]="total" 
    (closeCartEmmiter)="openCloseCart()"
    (productDeletedEmmiter)="removeCart($event)"></cart-modal>
    }
  </div>
</div>
